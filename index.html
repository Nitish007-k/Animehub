<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - Ultimate Anime Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            background: rgba(0,0,0,0.9);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav {
            display: flex;
            gap: 2rem;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .nav a:hover {
            color: #4ecdc4;
            background: rgba(255,255,255,0.1);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
        }

        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto 2rem;
            background: rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 0.5rem;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            color: white;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.8);
        }

        .search-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 1rem 2rem;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .anime-card {
            background: rgba(255,255,255,0.12);
            border-radius: 25px;
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.18);
        }

        .anime-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .anime-poster {
            width: 100%;
            height: 420px;
            object-fit: cover;
            transition: transform 0.4s ease;
            background: linear-gradient(45deg, #333, #555);
        }

        .anime-card:hover .anime-poster {
            transform: scale(1.05);
        }

        .anime-info {
            padding: 1.8rem;
        }

        .anime-title {
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            color: #ffd700;
            font-size: 1.1rem;
        }

        .watch-links {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .watch-btn {
            padding: 0.7rem 1.4rem;
            border: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 90px;
        }

        .free { background: linear-gradient(45deg, #4ecdc4, #44a08d); color: white; }
        .premium { background: linear-gradient(45deg, #ff6b6b, #ee5a52); color: white; }

        .watch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .card-wheel-section {
            text-align: center;
            margin: 4rem 0;
            padding: 3rem;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .wheel-container {
            width: 450px;
            height: 450px;
            margin: 2rem auto;
            position: relative;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            box-shadow: 0 0 50px rgba(255,255,255,0.4);
            background: conic-gradient(
                #b0b0b0 0deg 45deg,
                #4ecdc4 45deg 90deg,
                #9b59b6 90deg 135deg,
                #f39c12 135deg 180deg,
                #e74c3c 180deg 225deg,
                #b0b0b0 225deg 270deg,
                #4ecdc4 270deg 315deg,
                #9b59b6 315deg 360deg
            );
        }

        .spin-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #feca57);
            border: none;
            padding: 1.5rem 4rem;
            border-radius: 50px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 2rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.08);
            box-shadow: 0 20px 40px rgba(255,107,107,0.5);
        }

        .character-card {
            background: rgba(0,0,0,0.95);
            border-radius: 25px;
            padding: 2.5rem;
            max-width: 420px;
            margin: 2rem auto;
            border: 4px solid;
            display: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .rarity-common { border-color: #b0b0b0; }
        .rarity-rare { border-color: #4ecdc4; }
        .rarity-epic { border-color: #9b59b6; }
        .rarity-legendary { border-color: #f39c12; }
        .rarity-mythic { border-color: #e74c3c; }

        .character-image {
            width: 200px;
            height: 260px;
            object-fit: cover;
            border-radius: 20px;
            margin: 0 auto 1.5rem;
            display: block;
            border: 4px solid rgba(255,255,255,0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            background: linear-gradient(45deg, #333, #555);
        }

        .character-name {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,1);
        }

        .character-meta {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        .rarity-badge {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.3rem;
            padding: 0.4rem 1.2rem;
            border-radius: 25px;
            background: rgba(255,215,0,0.3);
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat {
            background: rgba(255,255,255,0.15);
            padding: 1.5rem 1rem;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .stat:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #ffd700, #ffed4a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .collect-btn {
            width: 100%;
            margin-top: 2rem;
            padding: 1.4rem;
            font-size: 1.2rem;
            border-radius: 30px;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .anime-grid { grid-template-columns: 1fr; }
            .wheel-container { width: 350px; height: 350px; }
            .character-image { width: 160px; height: 210px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">🎌 AnimeHub Pro</div>
        <nav class="nav">
            <a href="#home">🏠 Home</a>
            <a href="#anime">📺 Anime</a>
            <a href="#cards">🎰 Cards</a>
            <a href="#collection">💎 Collection</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero">
            <h1>🌟 Ultimate Anime Experience</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search anime titles, characters...">
                <button class="search-btn" onclick="searchAnime()">🔍 Search</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('popular')">🔥 Popular</button>
            <button class="tab-btn" onclick="showTab('top-rated')">⭐ Top Rated</button>
            <button class="tab-btn" onclick="showTab('new')">🆕 Latest</button>
        </div>

        <div id="animeContent">
            <div class="anime-grid" id="animeGrid">
                <!-- Dynamic content -->
            </div>
        </div>

        <div id="cardWheelSection" class="card-wheel-section" style="display: none;">
            <h2>🎰 Epic Character Wheel</h2>
            <p style="font-size: 1.4rem; opacity: 0.9;">Spin for your favorite anime characters!</p>
            
            <div class="wheel-container">
                <div class="wheel" id="wheel"></div>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">💥 SPIN FOR LEGENDS!</button>
            <div id="characterCard" class="character-card"></div>
        </div>
    </div>

    <script>
        // MULTI-LAYER BACKUP IMAGE SYSTEM
        const ANIME_BACKUPS = {
            // Attack on Titan backups
            'aot': [
                'https://cdn.myanimelist.net/images/anime/10/117228.jpg',
                'https://cdn.myanimelist.net/images/anime/4/112607.jpg',
                'https://cdn.myanimelist.net/images/anime/1676/110025.jpg'
            ],
            // Demon Slayer backups
            'demon': [
                'https://cdn.myanimelist.net/images/anime/1107/110425.jpg',
                'https://cdn.myanimelist.net/images/anime/1117/118181.jpg',
                'https://cdn.myanimelist.net/images/anime/1380/118181.jpg'
            ],
            // One Piece backups
            'onepiece': [
                'https://cdn.myanimelist.net/images/anime/21/24022.jpg',
                'https://cdn.myanimelist.net/images/anime/3/40228.jpg',
                'https://cdn.myanimelist.net/images/anime/12/75243.jpg'
            ],
            // Jujutsu Kaisen backups
            'jujutsu': [
                'https://cdn.myanimelist.net/images/anime/1792/112269.jpg',
                'https://cdn.myanimelist.net/images/anime/40748/225326.jpg',
                'https://cdn.myanimelist.net/images/anime/44511/179937.jpg'
            ],
            // My Hero Academia backups
            'hero': [
                'https://cdn.myanimelist.net/images/anime/5/73623.jpg',
                'https://cdn.myanimelist.net/images/anime/16498/18498.jpg',
                'https://cdn.myanimelist.net/images/anime/35812/39849.jpg'
            ],
            // Death Note backups
            'death': [
                'https://cdn.myanimelist.net/images/anime/9/9453.jpg',
                'https://cdn.myanimelist.net/images/anime/9/10872.jpg',
                'https://cdn.myanimelist.net/images/anime/9/10873.jpg'
            ]
        };

        const CHARACTER_BACKUPS = {
            // Eren backups
            'eren': [
                'https://cdn.myanimelist.net/images/characters/5/404621.jpg',
                'https://cdn.myanimelist.net/images/characters/2/277443.jpg',
                'https://cdn.myanimelist.net/images/characters/13/501306.jpg'
            ],
            // Tanjiro backups
            'tanjiro': [
                'https://cdn.myanimelist.net/images/characters/15/603497.jpg',
                'https://cdn.myanimelist.net/images/characters/2/603499.jpg',
                'https://cdn.myanimelist.net/images/characters/11/603498.jpg'
            ],
            // Luffy backups
            'luffy': [
                'https://cdn.myanimelist.net/images/characters/3/56741.jpg',
                'https://cdn.myanimelist.net/images/characters/5/104614.jpg',
                'https://cdn.myanimelist.net/images/characters/6/104615.jpg'
            ],
            // Gojo backups
            'gojo': [
                'https://cdn.myanimelist.net/images/characters/4/497941.jpg',
                'https://cdn.myanimelist.net/images/characters/14/497942.jpg',
                'https://cdn.myanimelist.net/images/characters/3/497940.jpg'
            ],
            // Deku backups
            'deku': [
                'https://cdn.myanimelist.net/images/characters/4/101885.jpg',
                'https://cdn.myanimelist.net/images/characters/14/101886.jpg',
                'https://cdn.myanimelist.net/images/characters/3/101884.jpg'
            ],
            // Light backups
            'light': [
                'https://cdn.myanimelist.net/images/characters/3/28999.jpg',
                'https://cdn.myanimelist.net/images/characters/11/28998.jpg',
                'https://cdn.myanimelist.net/images/characters/4/28997.jpg'
            ]
        };

        // Primary anime database (first image is primary)
        const animeDatabase = [
            {
                title: "Attack on Titan",
                rating: 9.8,
                key: 'aot',
                poster: "https://cdn.myanimelist.net/images/anime/10/117228.jpg",
                free: "gogoanime",
                premium: "crunchyroll",
                description: "Humanity's last stand against monstrous Titans."
            },
            {
                title: "Demon Slayer",
                rating: 9.5,
                key: 'demon',
                poster: "https://cdn.myanimelist.net/images/anime/1107/110425.jpg",
                free: "9anime",
                premium: "funimation",
                description: "Tanjiro's epic journey to defeat demons."
            },
            {
                title: "One Piece",
                rating: 9.2,
                key: 'onepiece',
                poster: "https://cdn.myanimelist.net/images/anime/21/24022.jpg",
                free: "gogoanime",
                premium: "crunchyroll",
                description: "Luffy's quest for the ultimate treasure."
            },
            {
                title: "Jujutsu Kaisen",
                rating: 9.7,
                key: 'jujutsu',
                poster: "https://cdn.myanimelist.net/images/anime/1792/112269.jpg",
                free: "9anime",
                premium: "crunchyroll",
                description: "Cursed energy and supernatural battles."
            },
            {
                title: "My Hero Academia",
                rating: 9.1,
                key: 'hero',
                poster: "https://cdn.myanimelist.net/images/anime/5/73623.jpg",
                free: "gogoanime",
                premium: "funimation",
                description: "Heroes vs Villains in a superpowered world."
            },
            {
                title: "Death Note",
                rating: 9.4,
                key: 'death',
                poster: "https://cdn.myanimelist.net/images/anime/9/9453.jpg",
                free: "9anime",
                premium: "netflix",
                description: "The ultimate battle of intellects."
            }
        ];

        const characterCards = [
            {
                name: "Eren Yeager",
                anime: "Attack on Titan",
                rarity: "mythic",
                key: 'eren',
                image: "https://cdn.myanimelist.net/images/characters/5/404621.jpg",
                attack: 98, defense: 92, speed: 95, magic: 88, health: 96
            },
            {
                name: "Tanjiro Kamado",
                anime: "Demon Slayer",
                rarity: "legendary",
                key: 'tanjiro',
                image: "https://cdn.myanimelist.net/images/characters/15/603497.jpg",
                attack: 94, defense: 90, speed: 97, magic: 85, health: 98
            },
            {
                name: "Monkey D. Luffy",
                anime: "One Piece",
                rarity: "mythic",
                key: 'luffy',
                image: "https://cdn.myanimelist.net/images/characters/3/56741.jpg",
                attack: 99, defense: 85, speed: 96, magic: 75, health: 100
            },
            {
                name: "Satoru Gojo",
                anime: "Jujutsu Kaisen",
                rarity: "mythic",
                key: 'gojo',
                image: "https://cdn.myanimelist.net/images/characters/4/497941.jpg",
                attack: 100, defense: 98, speed: 99, magic: 100, health: 95
            },
            {
                name: "Izuku Midoriya",
                anime: "My Hero Academia",
                rarity: "epic",
                key: 'deku',
                image: "https://cdn.myanimelist.net/images/characters/4/101885.jpg",
                attack: 92, defense: 88, speed: 94, magic: 96, health: 93
            },
            {
                name: "Light Yagami",
                anime: "Death Note",
                rarity: "rare",
                key: 'light',
                image: "https://cdn.myanimelist.net/images/characters/3/28999.jpg",
                attack: 85, defense: 78, speed: 92, magic: 99, health: 82
            }
        ];

        let isSpinning = false;

        // ADVANCED IMAGE LOADER WITH BACKUPS
        function loadImageWithBackup(img, backups, index = 0) {
            if (index >= backups.length) {
                // Final fallback - anime-themed image
                img.src = 'https://cdn.myanimelist.net/images/anime/10/117228.jpg';
                return;
            }
            
            img.src = backups[index];
            img.onerror = () => loadImageWithBackup(img, backups, index + 1);
            img.onload = () => {
                img.style.opacity = '1';
                img.classList.remove('image-loading');
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            displayAnime(animeDatabase);
        });

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            let filtered = animeDatabase;
            if (tab === 'top-rated') {
                filtered = [...animeDatabase].sort((a, b) => b.rating - a.rating);
            }
            displayAnime(filtered);
        }

        function displayAnime(animeList) {
            document.getElementById('animeGrid').innerHTML = animeList.map(anime => `
                <div class="anime-card">
                    <img src="${anime.poster}" 
                         alt="${anime.title} official poster"
                         class="anime-poster image-loading"
                         data-backup-key="${anime.key}"
                         loading="lazy"
                         oncontextmenu="return false;">
                    <div class="anime-info">
                        <h3 class="anime-title">${anime.title}</h3>
                        <div class="rating">
                            <span>★</span><span>${anime.rating}/10</span>
                        </div>
                        <div class="watch-links">
                            <button class="watch-btn free" onclick="openStream('${anime.free}')">Free ▶</button>
                            <button class="watch-btn premium" onclick="openStream('${anime.premium}')">Premium ▶</button>
                        </div>
                        <p style="opacity: 0.9;">${anime.description}</p>
                    </div>
                </div>
            `).join('');
            
            // Initialize backup system for anime posters
            document.querySelectorAll('.anime-poster').forEach(img => {
                img.addEventListener('error', function() {
                    const key = this.dataset.backupKey;
                    if (ANIME_BACKUPS[key]) {
                        loadImageWithBackup(this, ANIME_BACKUPS[key]);
                    }
                });
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.3s ease';
            });
        }

        function searchAnime() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return displayAnime(animeDatabase);
            
            const filtered = animeDatabase.filter(anime => 
                anime.title.toLowerCase().includes(query)
            );
            displayAnime(filtered.length ? filtered : animeDatabase);
        }

        function openStream(platform) {
            const urls = {
                gogoanime: 'https://gogoanime.gg/',
                '9anime': 'https://9anime.to/home',
                crunchyroll: 'https://www.crunchyroll.com/',
                funimation: 'https://www.funimation.com/',
                netflix: 'https://www.netflix.com/'
            };
            window.open(urls[platform] || 'https://www.crunchyroll.com/', '_blank');
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            const btn = document.getElementById('spinBtn');
            const wheel = document.getElementById('wheel');
            
            btn.disabled = true;
            btn.textContent = '🎲 SPINNING...';
            
            const rotation = Math.floor(Math.random() * 3600) + 1440;
            wheel.style.transform = `rotate(${rotation}deg)`;
            
            setTimeout(() => {
                const index = Math.floor((rotation % 360) / 51.4) % characterCards.length;
                showCharacterCard(characterCards[index]);
                isSpinning = false;
                btn.disabled = false;
                btn.textContent = '💥 SPIN FOR LEGENDS!';
            }, 4500);
        }

        function showCharacterCard(card) {
            const container = document.getElementById('characterCard');
            container.innerHTML = `
                <img src="${card.image}" 
                     alt="${card.name} official character portrait from ${card.anime}"
                     class="character-image image-loading"
                     data-backup-key="${card.key}"
                     loading="lazy"
                     oncontextmenu="return false;">
                
                <h3 class="character-name">${card.name}</h3>
                <div class="character-meta">
                    ${card.anime} • <span class="rarity-badge">${card.rarity.toUpperCase()}</span>
                </div>
                
                <div class="stats">
                    <div class="stat"><span class="stat-value">${card.attack}</span>⚔️ Attack</div>
                    <div class="stat"><span class="stat-value">${card.defense}</span>🛡️ Defense</div>
                    <div class="stat"><span class="stat-value">${card.speed}</span>⚡ Speed</div>
                    <div class="stat"><span class="stat-value">${card.magic}</span>✨ Magic</div>
                    <div class="stat" style="grid-column: span 2;">
                        <span class="stat-value">${card.health}</span>❤️ Health
                    </div>
                </div>
                
                <button class="watch-btn free collect-btn" onclick="collectCard('${card.name}')">
                    🎉 Collect Character!
                </button>
            `;
            container.className = `character-card rarity-${card.rarity}`;
            container.style.display = 'block';
            
            // Initialize character image backup
            const charImg = container.querySelector('.character-image');
            charImg.addEventListener('error', function() {
                if (CHARACTER_BACKUPS[card.key]) {
                    loadImageWithBackup(this, CHARACTER_BACKUPS[card.key]);
                }
            });
            charImg.style.opacity = '0';
            charImg.style.transition = 'opacity 0.3s ease';
        }

        function collectCard(name) {
            alert(`🎉 ${name} added to your collection! Keep spinning for more rare cards!`);
        }

        // Navigation
        document.querySelectorAll('.nav a').forEach(link => {
            link.onclick = (e) => {
                e.preventDefault();
                const target = link.getAttribute('href');
                if (target === '#cards') {
                    document.getElementById('animeContent').style.display = 'none';
                    document.getElementById('cardWheelSection').style.display = 'block';
                } else {
                    document.getElementById('animeContent').style.display = 'block';
                    document.getElementById('cardWheelSection').style.display = 'none';
                }
            };
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAnime();
        });
    </script>
</body>
</html>
